[workspace]
members  = ["source/oh-my-lint-cli", "source/oh-my-lint-lib"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
clap       = { version = "4.6.7", features = ["derive"] }
regex      = { version = "1.13.1" }
serde      = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
similar    = { version = "3.1.2" }
sqlparser  = { version = "0.64" }

[profile.release]
lto   = true
strip = true
